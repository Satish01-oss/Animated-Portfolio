<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satish Kumar Ram — MERN Stack &amp; Interactive Web Developer</title>
<meta name="description" content="Satish Kumar Ram — MERN stack, frontend and interactive web developer and BCA student in India. Portfolio and CV: React, Node.js, MongoDB, Three.js and GSAP projects.">
<meta name="theme-color" content="#f4f3f1">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' x='4' font-size='24' font-family='Georgia,serif'>S</text></svg>">

<!-- Everything the first screen needs, requested with the HTML itself rather
     than discovered later by JS or CSS: the opening frame of the hero and
     the three fonts. Self-hosted, so there is no third-party connection to
     wait on — 74 KB of type in total. -->
<link rel="preload" href="/assets/sequence/male0001.webp" as="image" fetchpriority="high">
<link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>

<style>
  /* Geist for everything read, Geist Mono for labels and numbers,
     Instrument Serif italic for the accent words. Latin subset. OFL-1.1,
     licences in /fonts. Declared here, not in the bundle, so the URLs are
     relative to the page and match the preloads above exactly. */
  @font-face {
    font-family: "Geist";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/fonts/geist.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Geist Mono";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/fonts/geist-mono.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Instrument Serif";
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url("/fonts/instrument-serif-italic.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* The boot screen: painted with the very first bytes of HTML, before any
     JS has loaded, and lifted by App as soon as the opening frame and the
     fonts are in. */
  .boot {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.1rem;
    background: #f4f3f1;
    color: #0a0a0a;
    transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s linear 0.45s;
  }
  [data-theme="dark"] .boot { background: #0c0c0d; color: #f2f1ef; }
  .boot.is-done { opacity: 0; visibility: hidden; }
  .boot__name {
    margin: 0;
    font: 500 1.35rem/1 "Geist", system-ui, sans-serif;
    letter-spacing: -0.03em;
  }
  .boot__line {
    position: relative;
    width: min(200px, 56vw);
    height: 1px;
    overflow: hidden;
    background: rgba(128, 128, 128, 0.25);
  }
  .boot__line::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    background: currentColor;
    animation: boot 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes boot {
    from { transform: translateX(-100%); }
    to   { transform: translateX(250%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot__line::after { animation: none; width: 100%; opacity: 0.5; }
  }
</style>

<!-- Resolve the theme before first paint so there is no flash. -->
<script>
  document.documentElement.classList.add("js");
  try {
    var saved = localStorage.getItem("theme");
    var system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", saved || system);
  } catch (e) {}
</script>
</head>
<body>
<div class="boot" id="boot" aria-hidden="true">
  <p class="boot__name">Satish Kumar Ram</p>
  <span class="boot__line"></span>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
